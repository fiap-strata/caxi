<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><title>Caxi · QA mobile</title
  ><style>
    body {
      margin: 0;
      background: #dfe5dc;
      font: 14px system-ui;
      display: grid;
      justify-content: center;
      gap: 18px;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: #173f35;
    }
    iframe {
      background: #fafbf7;
      border: 1px solid #b5c3b1;
      border-radius: 18px;
      box-shadow: 0 10px 50px #173f3520;
      height: 844px;
      width: 390px;
      max-width: 100%;
      box-sizing: border-box;
    }
    select {
      padding: 8px;
      border-radius: 7px;
      border: 1px solid #b5c3b1;
    }
  </style>
  <header>
    <b>Caxi · conferência mobile</b
    ><label
      >Largura
      <select
        aria-label="Largura da prévia"
        onchange="document.querySelector('iframe').style.width = this.value + 'px'"
      >
        <option>360</option>
        <option selected>390</option>
        <option>430</option>
      </select></label
    >
  </header>
  <iframe title="Caxi em tela de celular" src="/"></iframe>
</html>
