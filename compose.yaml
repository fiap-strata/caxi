# Ambiente local de demonstração. AUTH_PROVIDER=demo não envia OTP real.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: caxi
      POSTGRES_USER: caxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caxi_local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caxi -d caxi']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      AUTH_PROVIDER: demo
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://caxi:${POSTGRES_PASSWORD:-caxi_local}@postgres:5432/caxi
      APP_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - product-photos:/app/apps/api/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 5s
      retries: 10
volumes:
  postgres-data:
  product-photos:
