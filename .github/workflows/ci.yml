# Adaptado da contribuição de Enzo para o monorepo consolidado.
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Dependências de produção
        run: npm audit --omit=dev --audit-level=high
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: caxi
          POSTGRES_PASSWORD: caxi_ci
          POSTGRES_DB: caxi_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U caxi -d caxi_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://caxi:caxi_ci@127.0.0.1:5432/caxi_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
  ambiente-reproduzivel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: docker compose up --build -d --wait
      - name: Jornada por HTTP e proxy nginx
        run: CAXI_BASE_URL=http://localhost:8080 npm run smoke
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Encerrar ambiente descartável
        if: always()
        run: docker compose down -v
